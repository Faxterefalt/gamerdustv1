# Servicios de desarrollo local. La base de datos replica la configuración de .env.
services:
    mysql:
        image: mysql:8.4
        environment:
            MYSQL_DATABASE: gamerdust
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
        ports:
            - "3306:3306"
        volumes:
            - mysql-data:/var/lib/mysql

volumes:
    mysql-data:
